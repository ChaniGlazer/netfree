<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c1f36"/>
    </linearGradient>

    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09849"/>
      <stop offset="50%" stop-color="#e07a3e"/>
      <stop offset="100%" stop-color="#b6491b"/>
    </linearGradient>

    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#f7d08a"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <path id="single-petal" d="M 0,-12 C 28,-38 42,-65 22,-82 C 0,-96 -22,-96 -38,-78 C -48,-60 -28,-38 0,-12 Z" />
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="46" fill="url(#bg)"/>

  <g transform="translate(100,100)" filter="url(#shadow)">
    <g fill="url(#petal)">
      <use href="#single-petal" transform="rotate(0)"/>
      <use href="#single-petal" transform="rotate(60)"/>
      <use href="#single-petal" transform="rotate(120)"/>
      <use href="#single-petal" transform="rotate(180)"/>
      <use href="#single-petal" transform="rotate(240)"/>
      <use href="#single-petal" transform="rotate(300)"/>
    </g>

    <g fill="#fbead9" opacity="0.9">
      <circle cx="0" cy="-26" r="3"/>
      <circle cx="22.5" cy="-13" r="3"/>
      <circle cx="22.5" cy="13" r="3"/>
      <circle cx="0" cy="26" r="3"/>
      <circle cx="-22.5" cy="13" r="3"/>
      <circle cx="-22.5" cy="-13" r="3"/>
    </g>

    <circle cx="0" cy="0" r="18" fill="url(#centerGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#fbead9" opacity="0.5"/>
  </g>
</svg>
